[project]
name = "occumap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.88",
    "pandas>=3.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.1",
    "ipykernel>=7.2",
    "streamlit>=1.56",
]

[project.scripts]
occumap = "occumap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/occumap"]
